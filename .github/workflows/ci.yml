name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Esto es lo que caza un import roto: ni los tests ni un build lo detectan,
      # sólo aparece al cargar la app.
      - name: Verificar que la app carga
        run: node -e "require('./src/app'); console.log('app loaded OK')"
